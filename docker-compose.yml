version: "3"

services:
  app:
    build:
      dockerfile: Dockerfile
    ports:
      - 9001:80
    volumes:
      - ./api:/app/api
      - ./common:/app/common
      # Local upload storage (dev): file upload đổ vào ./storage/uploads trên host để persist + dễ xem.
      # Prod (CapRover): KHÔNG dùng file này — khai báo Persistent Directory /app/api/web/uploads trong dashboard.
      - ./storage/uploads:/app/api/web/uploads
    #      - ./console:/app/console
    #      - ./storage:/app/storage
    #      - ./:/app
    env_file: .env
